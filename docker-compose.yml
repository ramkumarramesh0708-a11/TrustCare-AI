version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: trustcare_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: trustcare_secure_password
      POSTGRES_DB: trustcare_ai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trustcare_backend
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
      - SECRET_KEY=trustcare-super-secret-production-key-at-least-32-chars-long
      - DATABASE_URL=postgresql+psycopg2://postgres:trustcare_secure_password@db:5432/trustcare_ai
      - ALLOWED_ORIGINS=http://localhost,http://localhost:5173,http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: trustcare_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
